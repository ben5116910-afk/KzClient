
name: Build KzClient

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP"
            exit 1
          fi
          unzip -q "$ZIP" -d project

      - name: Locate Gradle Wrapper
        id: locate
        run: |
          WRAPPER=$(find project -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No se encontró gradlew"
            find project -maxdepth 3 -type f | head -n 100
            exit 1
          fi
          echo "dir=$(dirname "$WRAPPER")" >> "$GITHUB_OUTPUT"

      - name: Build KzClient
        working-directory: project
        run: |
          chmod +x "${{ steps.locate.outputs.dir }}/gradlew"
          cd "${{ steps.locate.outputs.dir }}"
          ./gradlew clean build --no-daemon

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KzClient-1.5.0
          path: project/**/build/libs/*.jar
          if-no-files-found: error
