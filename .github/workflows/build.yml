
name: Build KzClient

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIP
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No se encontró el ZIP"
            exit 1
          fi
          unzip -q "$ZIP" -d project

      - name: Locate and build project
        run: |
          WRAPPER=$(find project -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "No se encontró gradlew"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          chmod +x "$WRAPPER"
          cd "$PROJECT_DIR"
          ./gradlew clean build --no-daemon

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KzClient-1.5.0
          path: project/**/build/libs/*.jar
          if-no-files-found: error
