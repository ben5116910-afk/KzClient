
name: Build KzClient

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          unzip -q "$ZIP" -d project

      - name: Inspect ZIP structure
        run: |
          echo "=== ARCHIVOS GRADLE ==="
          find project -type f \( -name gradlew -o -name gradle-wrapper.jar -o -name build.gradle -o -name build.gradle.kts \)
          echo "=== DIRECTORIOS ==="
          find project -maxdepth 4 -type d | head -n 100

      - name: Locate and build project
        run: |
          WRAPPER=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No se encontró gradlew en el ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "Proyecto encontrado en: $PROJECT_DIR"

          chmod +x "$WRAPPER"
          cd "$PROJECT_DIR"
          ./gradlew clean build --no-daemon

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KzClient-1.5.0
          path: project/**/build/libs/*.jar
          if-no-files-found: error
